<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flappy Bird - Login</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      min-height: 100vh; display: flex;
      align-items: center; justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      overflow: hidden;
    }
    .stars {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background-image:
        radial-gradient(1px 1px at 10% 20%, white, transparent),
        radial-gradient(1px 1px at 30% 60%, white, transparent),
        radial-gradient(1px 1px at 50% 10%, white, transparent),
        radial-gradient(1px 1px at 70% 80%, white, transparent),
        radial-gradient(1px 1px at 90% 40%, white, transparent),
        radial-gradient(2px 2px at 20% 85%, rgba(255,255,200,0.8), transparent),
        radial-gradient(2px 2px at 60% 30%, rgba(255,255,200,0.8), transparent),
        radial-gradient(1px 1px at 80% 65%, white, transparent);
      animation: twinkle 4s ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      0%   { opacity: 0.6; }
      100% { opacity: 1; }
    }
    .clouds {
      position: fixed; top:0; left:0; width:200%; height:100%;
      background-image:
        radial-gradient(ellipse 120px 40px at 20% 25%, rgba(255,255,255,0.07), transparent),
        radial-gradient(ellipse 80px 30px at 60% 35%, rgba(255,255,255,0.05), transparent),
        radial-gradient(ellipse 150px 45px at 85% 20%, rgba(255,255,255,0.06), transparent);
      animation: drift 30s linear infinite;
    }
    @keyframes drift { from{transform:translateX(0)} to{transform:translateX(-50%)} }

    .login-box {
      position: relative; z-index: 10;
      background: rgba(15, 52, 96, 0.85);
      border: 2px solid rgba(255, 210, 50, 0.6);
      border-radius: 20px; padding: 48px 40px;
      text-align: center; width: 360px;
      box-shadow: 0 0 50px rgba(255,210,50,0.2), 0 20px 60px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
    }
    .bird-icon {
      font-size: 4rem; margin-bottom: 8px;
      display: block;
      animation: flap 0.6s ease-in-out infinite alternate;
    }
    @keyframes flap {
      from { transform: translateY(0) rotate(-5deg); }
      to   { transform: translateY(-10px) rotate(5deg); }
    }
    h1 { color: #FFD232; font-size: 2rem; margin-bottom: 6px;
      text-shadow: 0 0 20px rgba(255,210,50,0.5); }
    .subtitle { color: #a8d8f0; margin-bottom: 28px; font-size: 0.9rem; }
    input {
      width: 100%; padding: 14px 16px; margin-bottom: 14px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,210,50,0.4);
      border-radius: 10px; color: #fff; font-size: 1rem; outline: none;
    }
    input:focus { border-color: #FFD232; box-shadow: 0 0 10px rgba(255,210,50,0.3); }
    input::placeholder { color: rgba(255,255,255,0.35); }
    button {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #FFD232, #e6a800);
      border: none; border-radius: 10px;
      color: #1a1a2e; font-size: 1.1rem; font-weight: 800;
      cursor: pointer; transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(255,210,50,0.4);
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(255,210,50,0.6); }
    #err { color: #ff6b6b; margin-top: 12px; font-size: 0.9rem; min-height: 20px; }
  </style>
</head>
<body>
  <div class="stars"></div>
  <div class="clouds"></div>
  <div class="login-box">
    <span class="bird-icon">🐦</span>
    <h1>Flappy Bird</h1>
    <p class="subtitle">Login to take flight!</p>
    <input type="text" id="user" placeholder="Username" />
    <input type="password" id="pass" placeholder="Password" />
    <button onclick="login()">▶ Play Now</button>
    <p id="err"></p>
  </div>
  <script>
    function login() {
      const u = document.getElementById('user').value.trim();
      const p = document.getElementById('pass').value;
      if (u === 'deepthi' && p === 'deepu@2006') {
        window.location.href = 'game.html';
      } else {
        document.getElementById('err').textContent = '❌ Wrong username or password!';
      }
    }
    document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  </script>
</body>
</html>
