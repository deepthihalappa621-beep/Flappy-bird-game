<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🐦 Flappy Bird</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #1a1a2e;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    .bg-sky {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: linear-gradient(180deg, #1a1a2e 0%, #0f3460 60%, #16213e 100%);
    }
    .wrapper { position: relative; z-index: 10; }
    .hud {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(15,52,96,0.9); border: 2px solid rgba(255,210,50,0.5);
      border-bottom: none; border-radius: 12px 12px 0 0;
      padding: 10px 20px; color: #FFD232; font-size: 0.9rem; font-weight: bold;
    }
    canvas {
      display: block;
      border: 2px solid rgba(255,210,50,0.5);
      border-radius: 0 0 12px 12px;
    }
    #overlay {
      position: absolute; top: 44px; left: 0; right: 0; bottom: 0;
      background: rgba(10,20,40,0.88);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      border-radius: 0 0 12px 12px;
    }
    #overlay h2 { color: #FFD232; font-size: 2.2rem; margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(255,210,50,0.6); }
    #overlay p  { color: #a8d8f0; margin-bottom: 8px; font-size: 1rem; }
    #overlay .hint { color: rgba(255,255,255,0.4); font-size: 0.82rem; margin-bottom: 24px; }
    #overlay button {
      padding: 14px 40px;
      background: linear-gradient(135deg, #FFD232, #e6a800);
      border: none; border-radius: 10px;
      color: #1a1a2e; font-size: 1.1rem; font-weight: 800;
      cursor: pointer; transition: all 0.3s;
    }
    #overlay button:hover { transform: scale(1.06); }
    #medal { font-size: 2.5rem; margin-bottom: 6px; }
  </style>
</head>
<body>
  <div class="bg-sky"></div>
  <div class="wrapper">
    <div class="hud">
      <span>👤 deepthi</span>
      <span id="score-hud">Score: 0</span>
      <span id="best-hud">Best: 0</span>
    </div>
    <canvas id="c" width="400" height="550"></canvas>
    <div id="overlay">
      <div id="medal"></div>
      <h2 id="ov-title">🐦 Flappy Bird</h2>
      <p id="ov-msg">Tap or press Space / ↑ to flap</p>
      <p class="hint" id="ov-hint">Avoid the pipes!</p>
      <button id="ov-btn" onclick="startGame()">▶ Start</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
